<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
   <head>
      <title>Piano</title>
      <link rel="stylesheet" href="piano.css" type="text/css" />

      <!--<script type="text/javascript" src="../dist/jwiXML.adv.cls.js" language="javascript"></script>-->

      <script type="text/javascript" src="instrument.js" language="javascript"></script>
      <script type="text/javascript">
         /* These functions are called from XSLT using the namespace http://saxonica.com/ns/globalJS,
          e.g. xmlns:js="http://saxonica.com/ns/globalJS"  .... js:animProgress($anim)
          */        
        
         /* Begin an animation */
         function animate(a) {
            a.beginElement();
         }
         
         /* delete an animation */
         function unAnimate(a) {
            if (a != null) {
               a.endElement();
            }
         }
         </script>
   </head>
   <body onload="SaxonJS.transform({

            <td>

            </td>
         </tr>
      </table>
      <!--<div id="controls"></div>
